apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd

spec:
  description: Default project

  sourceRepos:
    - "*"

  destinations:
    - namespace: dev
      server: https://kubernetes.default.svc

    - namespace: stage
      server: https://kubernetes.default.svc

    - namespace: myapp
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
