apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp

spec:
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: ponkoog/myapp:4.1
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 5000

        # Probes Configuration
        livenessProbe:
          httpGet:
            path: /health  # Update path if your app uses a different endpoint (e.g., / or /api/health)
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health  # Update path to your readiness endpoint
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2

        envFrom:
        - configMapRef:
            name: myapp
        - secretRef:
            name: myapp-secret